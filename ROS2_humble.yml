name: Auto_Aim C/C++ CI (ROS2 Humble - 仅编译检查)

on:
  push:
    branches: [ "Observation-of-the-whole-vehicle" ]
  pull_request:
    branches: [ "Observation-of-the-whole-vehicle" ]

jobs:
  build-check:
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出代码到工作目录
      - uses: actions/checkout@v4

      # 2. 安装ROS2 Humble及编译依赖
      - name: Install ROS2 Humble and build tools
        run: |
          # 配置基础软件源
          sudo apt-get update && sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe

          # 添加ROS2源和密钥
          sudo apt-get install -y curl
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

          # 安装ROS2核心包、编译工具（colcon是ROS2标准构建工具，依赖CMake）
          sudo apt-get update && sudo apt-get install -y \
            ros-humble-desktop \
            ros-humble-ament-cmake \
            python3-colcon-common-extensions \
            build-essential \
            cmake \
            g++

          # 加载ROS2环境变量（确保编译时能找到ROS2库和头文件）
          source /opt/ros/humble/setup.bash

      # 3. 编译项目并验证编译结果
      - name: Build project with colcon
        run: |
          source /opt/ros/humble/setup.bash
          cd ${{ github.workspace }}  # 进入代码根目录（检出的仓库路径）

          # 使用colcon编译（ROS2标准构建命令，自动处理CMakeLists.txt）
          colcon build

          # 验证编译是否成功：检查build目录是否存在（colcon编译成功会生成build目录）
          if [ -d "build" ]; then
            echo "✅ 编译成功：build目录已生成"
          else
            echo "❌ 编译失败：未生成build目录"
            exit 1  # 编译失败时，工作流标记为"不通过"
          fi
