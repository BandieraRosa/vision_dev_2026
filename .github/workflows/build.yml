name: SonarQube
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ROS 2 Humble apt repo
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update

      - name: Install ROS 2 + build tools
        run: |
          sudo apt-get install -y \
            ros-humble-ros-base \
            python3-colcon-common-extensions \
            python3-rosdep \
            build-essential \
            cmake \
            ninja-build

      - name: Setup LibXR
        run: |
          sudo apt-get install -y libwpa-client-dev libnm-dev libudev-dev libasio-dev

      - name: Init rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      - name: Install workspace dependencies (rosdep)
        run: |
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: colcon build (export compile_commands)
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --merge-install --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          test -f build/compile_commands.json
          echo "Found build/compile_commands.json"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define "sonar.cfamily.compile-commands=build/compile_commands.json"
